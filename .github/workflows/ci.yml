name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Zero runtime dependencies — no install step needed.
      # Includes the firmware drift guard and the host-compiled C detector test
      # (ubuntu runners ship gcc).
      - run: npm test
