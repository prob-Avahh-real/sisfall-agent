<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>SisFall · 跌倒风险监测</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="bar">
    <strong>SisFall</strong>
    <span class="privacy">本地分析 · 不上传视频</span>
  </header>

  <main>
    <section class="monitor" aria-label="实时姿态监测">
      <div class="stage" id="stage">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div class="empty" id="emptyState"><p id="emptyText">等待画面。请站到镜头前，或运行演示场景。</p></div>
        <div class="live-badge" id="liveBadge"><i></i> 实时</div>
        <div class="alert" id="alertBox"><span id="alertAdvice"></span></div>
        <div class="nudge" id="nudgeBox"><span id="nudgeText"></span></div>
        <div class="askbar" id="askBar"><span id="askText"></span><span class="ask-actions"><button id="askYes">是</button><button id="askNo">不是</button></span></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>

      <aside class="panel">
        <div class="head">
          <span>状态</span>
          <span class="state-chip calibrating" id="stateChip">校准中</span>
          <button id="soundBtn" aria-label="声音开关">声音：开</button>
        </div>

        <div class="scoreline">
          <strong id="score">0</strong>
          <span class="risk-label stable" id="riskLabel">平稳 · 姿态平衡</span>
        </div>
        <div class="track"><i id="gaugeBar"></i></div>

        <ul id="signals">
          <li><span>姿态</span><b>等待</b></li>
          <li><span>重心</span><b>等待</b></li>
          <li><span>下降</span><b>等待</b></li>
          <li><span>预测</span><b>等待</b></li>
          <li><span>个人基线</span><b>学习中</b></li>
          <li><span>症状</span><b>无</b></li>
        </ul>

        <h3>报告症状</h3>
        <div class="chips" id="checkinChips">
          <button data-symptom="dizziness" aria-label="报告起身发晕">起身发晕</button>
          <button data-symptom="fatigue" aria-label="报告疲劳">疲劳</button>
          <button data-symptom="sleepDebt" aria-label="报告睡眠不足">睡眠不足</button>
          <button data-symptom="medicationOff" aria-label="报告药效减退">药效减退</button>
        </div>

        <h3>护理建议</h3>
        <p class="care-label" id="careLabel">正在收集证据…</p>
        <ul id="careAdvice"></ul>

        <h3>康复训练</h3>
        <p class="training-status" id="trainingStatus">未开始</p>
        <div class="training-now" id="trainingNow" style="display:none">
          <b id="trainExercise">—</b>
          <span class="train-remain" id="trainRemain"></span>
          <div class="track"><i id="trainProgress"></i></div>
          <p class="train-cue" id="trainCue"></p>
        </div>
        <div class="train-controls">
          <button class="secondary" id="trainBtn">开始训练</button>
          <button class="secondary" id="voiceBtn">语音唤出：关</button>
        </div>
        <div class="schedule-row">
          <label><input type="checkbox" id="scheduleOn" /> 训练提醒</label>
          <input type="time" id="scheduleTime" value="09:00" />
          <span class="schedule-state" id="scheduleState"></span>
        </div>
        <div class="schedule-row">
          <label><input type="checkbox" id="medOn" /> 服药提醒（遵医嘱设置）</label>
          <input type="time" id="medTime1" value="08:00" />
          <input type="time" id="medTime2" value="20:00" />
          <span class="schedule-state" id="medState"></span>
        </div>
        <p class="train-cue">训练动作为活动练习，不构成治疗方案。</p>

        <h3>音乐疗愈</h3>
        <div class="schedule-row">
          <label><input type="checkbox" id="musicOn" /> 开启</label>
          <select id="musicMode" aria-label="音乐疗愈模式">
            <option value="metronome" selected>节拍提示</option>
            <option value="breath">呼吸引导</option>
          </select>
          <select id="musicBpm" aria-label="节拍速率">
            <option value="80">80 BPM</option>
            <option value="90">90 BPM</option>
            <option value="100" selected>100 BPM</option>
            <option value="110">110 BPM</option>
            <option value="120">120 BPM</option>
          </select>
        </div>
        <p class="train-cue" id="musicState">未开启——节拍用于步态节律提示，呼吸用于放松。</p>

        <div class="actions">
          <button class="primary" id="cameraBtn">启动相机分析</button>
          <div class="sim-controls">
            <select id="scenario" aria-label="演示场景">
              <option value="stable">平稳行走</option>
              <option value="wobble">不稳行走</option>
              <option value="wobble-shift">步态突变</option>
              <option value="dizzy-walk">头晕步态（含签到）</option>
              <option value="near-fall" selected>差点跌倒</option>
              <option value="imu-near-fall">差点跌倒（IMU 通道）</option>
            </select>
            <button class="secondary" id="demoBtn">运行场景</button>
          </div>
          <button class="secondary" id="motionBtn">使用手机传感器</button>
          <button class="secondary" id="bleBtn">连接蓝牙手环</button>
        </div>
      </aside>
    </section>

    <p class="disclaimer">原型应用，非医疗器械：不做诊断、不涉及用药调整、不替代急救；可能漏报或误报。请遵医嘱并保持常规防跌倒措施。</p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
